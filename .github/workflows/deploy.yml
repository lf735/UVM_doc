name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RAG embedding dependencies
        run: pip install fastembed

      - name: Generate search data and views
        run: python scripts/build_docs.py

      - name: Generate RAG embeddings database
        run: python scripts/build_rag_embeddings.py

      - name: Verify generated search and RAG assets
        run: |
          test -f js/search_data.js || { echo "::error::js/search_data.js not found!" ; exit 1; }
          test -f data/rag_chunks.json || { echo "::error::data/rag_chunks.json not found!" ; exit 1; }
          test -f data/rag_embeddings.bin || { echo "::error::data/rag_embeddings.bin not found!" ; exit 1; }
          ls -lh js/search_data.js data/rag_chunks.json data/rag_embeddings.bin

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

