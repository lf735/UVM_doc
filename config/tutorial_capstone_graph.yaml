# -----------------------------------------------------------------------------
# Interactive Graph Specifications for Cytoscape.js (Ch.01 V-Cycle & Ch.13 Capstone)
# -----------------------------------------------------------------------------

vcycle_nodes:
  - id: spec
    label: "1. System Spec & Arch"
    role: architect
    phase: left_top
    x: 90
    y: 70
    owner: "System Architect"
    deliverables: "Functional spec, register map (IP-XACT/CSV), latency & bandwidth budgets, interface protocols."
    handoff: "Passes architectural spec & register definitions to both RTL Designer and Verification Architect."
    docUrl: "docs_view/overviews/intro-txt.html"
  - id: uarch
    label: "2. Micro-Architecture"
    role: designer
    phase: left_mid
    x: 165
    y: 165
    owner: "RTL Designer"
    deliverables: "Pipeline stages, FIFO sizing, FSM state encoding, backpressure strategy, clock/reset domain plan."
    handoff: "Reviews corner cases & error behaviors with Verifier to capture in the vPlan."
    docUrl: "docs_view/overviews/components-txt.html"
  - id: rtl
    label: "3. RTL Design (DUT)"
    role: designer
    phase: bottom_left
    x: 255
    y: 260
    owner: "RTL Designer"
    deliverables: "Synthesizable SystemVerilog modules (pkt_alu.sv), lint-clean RTL, basic smoke bring-up."
    handoff: "Freezes RTL interface contract (pin list + timing) for UVM virtual interfaces & SVA."
    docUrl: "docs_view/overviews/intro-txt.html"
  - id: vplan
    label: "4. Verification Plan (vPlan)"
    role: verifier
    phase: bottom_right
    x: 425
    y: 260
    owner: "Verification Engineer"
    deliverables: "Feature-to-metric matrix, stimulus scenarios, checkers/SVA list, functional & code coverage targets."
    handoff: "Mapped back to System Spec requirements (Architect) and driven by UVM testbench."
    docUrl: "docs_view/overviews/sequences-txt.html"
  - id: block_verif
    label: "5. Block UVM Testbench"
    role: verifier
    phase: right_mid
    x: 515
    y: 165
    owner: "Verification Engineer"
    deliverables: "Agents, sequences, scoreboard, C/DPI reference model, RAL, functional coverage, regressions."
    handoff: "Closes 100% functional/code coverage at IP level before subsystem vertical reuse."
    docUrl: "docs_view/comps/uvm_env-svh.html"
  - id: signoff
    label: "6. SoC Reuse & Sign-Off"
    role: architect
    phase: right_top
    x: 590
    y: 70
    owner: "Architect + Verifier + Designer"
    deliverables: "Vertical UVM_PASSIVE reuse in SoC, zero open UVM_ERRORs, 100% vPlan coverage sign-off."
    handoff: "Formal tape-out readiness review signed off jointly by Architect, Designer, and Verifier."
    docUrl: "docs_view/comps/uvm_agent-svh.html"

vcycle_edges:
  - source: spec
    target: uarch
    label: "Arch Spec"
  - source: uarch
    target: rtl
    label: "Micro-Arch"
  - source: rtl
    target: vplan
    label: "RTL Contract"
  - source: vplan
    target: block_verif
    label: "Metrics & Tests"
  - source: block_verif
    target: signoff
    label: "Closure"
  - source: spec
    target: signoff
    label: "Requirements Traceability"
    style: dashed
  - source: uarch
    target: block_verif
    label: "Corner-Case Review"
    style: dashed

capstone_layers:
  - layer: 3
    label: "Ch.03: Minimal Stimuli (Seq -> Seqr -> Drv -> DUT)"
  - layer: 4
    label: "Ch.04: Agent, Env, Factory & ConfigDB"
  - layer: 5
    label: "Ch.05: Monitor, TLM-1 & Scoreboard"
  - layer: 6
    label: "Ch.06: Functional Coverage & SVA"
  - layer: 7
    label: "Ch.07: Pipelining, APB Agent, Layered Seq & Virtual Seq"
  - layer: 8
    label: "Ch.08: Callbacks, Report Catcher & Cmdline"
  - layer: 9
    label: "Ch.09: Sub-Phases, Domains, Barriers & Heartbeat"
  - layer: 10
    label: "Ch.10: Register Abstraction Layer (RAL)"
  - layer: 11
    label: "Ch.11: TLM-2.0 Sockets & Temporal Decoupling"
  - layer: 12
    label: "Ch.12: DPI-C C Model & Vertical Subsystem Reuse"
  - layer: 13
    label: "Ch.13: Complete Unified Environment"

capstone_nodes:
  - id: grp_subsys
    label: "soc_subsys_env (Ch.12)"
    kind: container
    layer: 12
    chapterNum: 12
    chapterUrl: "tutorial_view/ch12_dpi_vertical_reuse.html"
    docUrl: "docs_view/comps/uvm_env-svh.html"
    studioFile: "soc_subsys_env.sv"
    role: "Vertical Reuse Container"
    summary: "Top subsystem wrapper instantiating block_alu_env and supporting UVM_PASSIVE vertical SoC reuse."
    ports: ["cfg: soc_subsys_cfg"]

  - id: grp_env
    label: "alu_env (Ch.04+)"
    parent: grp_subsys
    kind: container
    layer: 4
    chapterNum: 4
    chapterUrl: "tutorial_view/ch04_agent_factory_config.html"
    docUrl: "docs_view/comps/uvm_env-svh.html"
    studioFile: "alu_env.sv"
    role: "Verification Environment"
    summary: "Reusable block-level UVM environment coordinating agents, virtual sequencer, scoreboard, coverage, RAL, TLM-2, and heartbeat."
    ports: ["cfg: alu_env_cfg"]

  - id: uvm_test
    label: "alu_capstone_full_test\n(uvm_test)"
    kind: test
    layer: 3
    x: 430
    y: 45
    chapterNum: 13
    chapterUrl: "tutorial_view/ch03_minimal_stimuli.html"
    docUrl: "docs_view/comps/uvm_test-svh.html"
    studioFile: "alu_test.sv"
    role: "Test & Phase Controller"
    summary: "Top-level UVM test managing factory overrides, cmdline flags (+INJECT_ERR), reset/configure/main/shutdown sub-phases, and objections."
    ports: ["run_phase / sub-phases", "uvm_cmdline_processor"]

  - id: v_seqr
    label: "alu_virtual_sequencer\n(Ch.07)"
    parent: grp_env
    kind: seq
    layer: 7
    x: 245
    y: 155
    chapterNum: 7
    chapterUrl: "tutorial_view/ch07_pipelined_layered_vseq.html"
    docUrl: "docs_view/seq/uvm_sequencer-svh.html"
    studioFile: "alu_virtual_sequencer.sv"
    role: "Multi-Interface Coordinator"
    summary: "Holds sub-sequencer references (alu_sqr, apb_sqr) so virtual sequences synchronize register config and data streams via uvm_barrier & uvm_event."
    ports: ["alu_sqr -> data_agent.seqr", "apb_sqr -> apb_agt.seqr"]

  - id: layered_seq
    label: "alu_virtual_seq &\nLayered Frame Seq"
    kind: seq
    layer: 7
    x: 75
    y: 155
    chapterNum: 7
    chapterUrl: "tutorial_view/ch07_pipelined_layered_vseq.html"
    docUrl: "docs_view/seq/uvm_sequence-svh.html"
    studioFile: "alu_seq.sv"
    role: "Stimulus & Protocol Layering"
    summary: "Translates high-level macro frames (x+y)*scale into pipelined alu_item bursts and coordinates concurrent streams."
    ports: ["start_item / finish_item", "get_response(rsp)"]

  - id: data_seqr
    label: "data_agent.seqr\n(uvm_sequencer)"
    parent: grp_env
    kind: seq
    layer: 3
    x: 165
    y: 260
    chapterNum: 3
    chapterUrl: "tutorial_view/ch03_minimal_stimuli.html"
    docUrl: "docs_view/seq/uvm_sequencer-svh.html"
    studioFile: "alu_agent.sv"
    role: "Sequence Arbitration"
    summary: "Arbitrates concurrent sequences (SEQ_ARB_STRICT_FIFO, lock/grab) and routes alu_item requests/responses."
    ports: ["seq_item_export (TLM pull)"]

  - id: data_drv
    label: "alu_driver\n(Pipelined + CB)"
    parent: grp_env
    kind: driver
    layer: 3
    x: 165
    y: 365
    chapterNum: 3
    chapterUrl: "tutorial_view/ch03_minimal_stimuli.html"
    docUrl: "docs_view/comps/uvm_driver-svh.html"
    studioFile: "alu_driver.sv"
    role: "Pin-Level Driver"
    summary: "Drives Valid/Ready transactions onto alu_if, triggers pre_drive callbacks, and returns tagged responses asynchronously via put(rsp)."
    ports: ["seq_item_port", "virtual alu_if"]

  - id: err_cb
    label: "alu_err_inject_cb\n(uvm_callback)"
    kind: hook
    layer: 8
    x: 35
    y: 365
    chapterNum: 8
    chapterUrl: "tutorial_view/ch08_callbacks_reporting.html"
    docUrl: "docs_view/base/uvm_callback-svh.html"
    studioFile: "alu_driver_cb.sv"
    role: "Non-Intrusive Fault Hook"
    summary: "Registered via `uvm_register_cb to mutate selected transactions into ALU_INVAL without editing driver source."
    ports: ["pre_drive(drv, req)"]

  - id: data_mon
    label: "alu_monitor\n(Passive)"
    parent: grp_env
    kind: monitor
    layer: 5
    x: 330
    y: 365
    chapterNum: 5
    chapterUrl: "tutorial_view/ch05_monitor_scoreboard.html"
    docUrl: "docs_view/comps/uvm_monitor-svh.html"
    studioFile: "alu_monitor.sv"
    role: "Bus Observation"
    summary: "Passively samples accepted inputs (req_ap) and DUT outputs (rsp_ap) on alu_if clocking block and broadcasts via TLM analysis ports."
    ports: ["req_ap (analysis_port)", "rsp_ap (analysis_port)"]

  - id: apb_agt
    label: "apb_agt + apb_domain\n(Ch.07 / Ch.09)"
    parent: grp_env
    kind: agent
    layer: 7
    x: 490
    y: 260
    chapterNum: 7
    chapterUrl: "tutorial_view/ch07_pipelined_layered_vseq.html"
    docUrl: "docs_view/comps/uvm_agent-svh.html"
    studioFile: "apb_agent_pkg.sv"
    role: "APB3 Register Agent"
    summary: "Drives and monitors APB3 SETUP/ACCESS cycles on apb_if within its own synchronized uvm_domain."
    ports: ["ap (analysis_port)", "virtual apb_if"]

  - id: ral_block
    label: "pkt_alu_reg_block\n(RAL + Adapter + Predictor)"
    parent: grp_env
    kind: ral
    layer: 10
    x: 685
    y: 225
    chapterNum: 10
    chapterUrl: "tutorial_view/ch10_ral.html"
    docUrl: "docs_view/reg/uvm_reg_block-svh.html"
    studioFile: "pkt_alu_reg_block.sv"
    role: "Register Abstraction Layer"
    summary: "Models CTRL, STATUS, SAT_LIMIT, PKT_COUNT with apb_reg_adapter & explicit uvm_reg_predictor keeping desired/mirrored values synced."
    ports: ["apb_map", "reg_predictor.bus_in", "HDL backdoor"]

  - id: tlm2_bridge
    label: "alu_tlm2_bridge\n(nb_initiator_socket)"
    parent: grp_env
    kind: tlm
    layer: 11
    x: 495
    y: 365
    chapterNum: 11
    chapterUrl: "tutorial_view/ch11_tlm2_sockets.html"
    docUrl: "docs_view/tlm2/uvm_tlm2_sockets-svh.html"
    studioFile: "alu_tlm2_bridge.sv"
    role: "TLM-1 to TLM-2.0 Bridge"
    summary: "Converts alu_item into uvm_tlm_generic_payload and communicates via 4-phase nb_transport_fw/bw with uvm_tlm_time quantum."
    ports: ["req_imp", "nb_init_socket"]

  - id: ref_model
    label: "alu_ref_model\n(TLM-2 Target + DPI-C)"
    parent: grp_env
    kind: check
    layer: 5
    x: 685
    y: 365
    chapterNum: 12
    chapterUrl: "tutorial_view/ch12_dpi_vertical_reuse.html"
    docUrl: "docs_view/dpi/uvm_dpi-svh.html"
    studioFile: "alu_ref_model.sv"
    role: "Golden Reference Predictor"
    summary: "Receives transactions and calls the C reference model across SystemVerilog DPI-C to predict exact DUT outputs."
    ports: ["nb_target_socket", "DPI-C pkt_alu_dpi_calc"]

  - id: c_model
    label: "pkt_alu_ref.c\n(C Golden Model)"
    kind: external
    layer: 12
    x: 845
    y: 365
    chapterNum: 12
    chapterUrl: "tutorial_view/ch12_dpi_vertical_reuse.html"
    docUrl: "docs_view/dpi/uvm_dpi-svh.html"
    studioFile: "c_model/pkt_alu_ref.c"
    role: "C/C++ Reference Implementation"
    summary: "Compiled C model invoked directly by alu_ref_model via import \"DPI-C\" for algorithmic reuse."
    ports: ["C ABI pkt_alu_dpi_calc()"]

  - id: scoreboard
    label: "alu_scoreboard\n(TLM FIFOs + RAL Aware)"
    parent: grp_env
    kind: check
    layer: 5
    x: 685
    y: 475
    chapterNum: 5
    chapterUrl: "tutorial_view/ch05_monitor_scoreboard.html"
    docUrl: "docs_view/comps/uvm_scoreboard-svh.html"
    studioFile: "alu_scoreboard.sv"
    role: "Self-Checking Comparator"
    summary: "Buffers observed requests and responses in uvm_tlm_analysis_fifos, reads RAL mirror (SAT_LIMIT/CTRL), and checks expected vs actual."
    ports: ["req_export", "rsp_export", "reg_model mirror"]

  - id: cov_sub
    label: "alu_cov_subscriber\n(covergroup)"
    parent: grp_env
    kind: metric
    layer: 6
    x: 330
    y: 475
    chapterNum: 6
    chapterUrl: "tutorial_view/ch06_coverage_sva.html"
    docUrl: "docs_view/comps/uvm_subscriber-svh.html"
    studioFile: "alu_cov_subscriber.sv"
    role: "Functional Coverage Metrics"
    summary: "Samples opcodes, operand corner cases, error flags, and cross coverage from monitor analysis broadcasts."
    ports: ["analysis_export"]

  - id: dut_sva
    label: "pkt_alu (RTL DUT)\n+ alu_if SVA Assertions"
    kind: dut
    layer: 3
    x: 245
    y: 580
    chapterNum: 6
    chapterUrl: "tutorial_view/ch06_coverage_sva.html"
    docUrl: "docs_view/overviews/intro-txt.html"
    studioFile: "dut/pkt_alu.sv"
    role: "Hardware Design + Protocol SVA"
    summary: "Dual-interface Packet-ALU RTL coupled with SystemVerilog Assertions checking Valid/Ready stability and reset hygiene."
    ports: ["alu_if (Valid/Ready)", "apb_if (APB3)"]

  - id: infra_ctrl
    label: "Report Catcher &\nHeartbeat Watchdog"
    parent: grp_env
    kind: hook
    layer: 8
    x: 685
    y: 120
    chapterNum: 9
    chapterUrl: "tutorial_view/ch09_phasing_sync_heartbeat.html"
    docUrl: "docs_view/base/uvm_heartbeat-svh.html"
    studioFile: "alu_report_catcher.sv"
    role: "Diagnostics & Liveness"
    summary: "uvm_report_catcher filters expected injected faults; uvm_heartbeat monitors driver liveness against simulation hangs."
    ports: ["uvm_report_cb", "hb_trig (uvm_event)"]

capstone_edges:
  - source: uvm_test
    target: v_seqr
    label: "starts vseq"
    layer: 7
  - source: uvm_test
    target: infra_ctrl
    label: "configures CB / HB"
    layer: 8
  - source: layered_seq
    target: v_seqr
    label: "p_sequencer"
    layer: 7
  - source: v_seqr
    target: data_seqr
    label: "alu_sqr"
    layer: 7
  - source: v_seqr
    target: apb_agt
    label: "apb_sqr"
    layer: 7
  - source: data_seqr
    target: data_drv
    label: "seq_item_port"
    layer: 3
  - source: err_cb
    target: data_drv
    label: "pre_drive CB"
    layer: 8
  - source: data_drv
    target: dut_sva
    label: "alu_if pins"
    layer: 3
  - source: apb_agt
    target: dut_sva
    label: "apb_if pins"
    layer: 7
  - source: dut_sva
    target: data_mon
    label: "mon_cb"
    layer: 5
  - source: data_mon
    target: scoreboard
    label: "req_ap / rsp_ap"
    layer: 5
  - source: data_mon
    target: cov_sub
    label: "req_ap -> write()"
    layer: 6
  - source: data_mon
    target: tlm2_bridge
    label: "req_ap"
    layer: 11
  - source: tlm2_bridge
    target: ref_model
    label: "nb_transport_fw/bw"
    layer: 11
  - source: ref_model
    target: c_model
    label: "DPI-C call"
    layer: 12
  - source: ref_model
    target: scoreboard
    label: "predict()"
    layer: 5
  - source: apb_agt
    target: ral_block
    label: "bus_in -> predictor"
    layer: 10
  - source: ral_block
    target: scoreboard
    label: "get_mirrored_value()"
    layer: 10
