<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVM 1.2 Interactive Documentation & Source Explorer</title>
  <meta name="description"
    content="Dynamic modern documentation and SystemVerilog source code browser for Accellera Universal Verification Methodology (UVM 1.2).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>

<body id="app-container" class="mode-docs">

  <!-- Application Header -->
  <header class="app-header">
    <div class="brand-section">
      <button class="icon-btn" id="menu-toggle" aria-label="Toggle navigation menu">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <a href="#/doc/overviews/intro-txt.html" class="brand-link">
        <div class="brand-icon">U</div>
        <span>UVM 1.2 Docs</span>
        <span class="brand-badge">Standard</span>
      </a>
    </div>

    <!-- Global Search Input Trigger -->
    <div class="search-trigger" id="search-trigger" role="button" tabindex="0" title="Quick search (Press /)">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" stroke-width="2" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" />
      </svg>
      <span class="search-placeholder">Search classes, macros, methods, files...</span>
      <kbd class="search-kbd">/</kbd>
    </div>

    <!-- View Mode Switcher -->
    <div class="view-switcher">
      <button class="view-btn active" data-mode="docs" title="Documentation View">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>Docs</span>
      </button>
      <button class="view-btn" data-mode="source" title="Source Code Explorer">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg>
        <span>Source</span>
      </button>
      <button class="view-btn" data-mode="split" title="Split View (Documentation + Source Code)">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <line x1="12" y1="3" x2="12" y2="21" />
        </svg>
        <span>Split View</span>
      </button>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
        <!-- SVG injected by js -->
      </button>
      <a href="https://github.com/accellera-official" target="_blank" rel="noopener noreferrer" class="icon-btn"
        title="Accellera Official GitHub">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
        </svg>
      </a>
    </div>
  </header>

  <!-- Application Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab-btn active" data-tab="docs">Documentation</button>
        <button class="sidebar-tab-btn" data-tab="source">Source Tree</button>
        <button class="sidebar-tab-btn" data-tab="index">Index A-Z</button>
      </div>

      <div class="sidebar-filter">
        <div class="sidebar-filter-row">
          <div class="sidebar-input-wrapper">
            <input type="text" id="sidebar-filter" class="filter-input" placeholder="Filter current view..." autocomplete="off">
            <button type="button" id="sidebar-filter-clear" class="search-clear-btn" title="Clear filter (Esc)" aria-label="Clear filter" style="display:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
            <button type="button" id="sidebar-filter-regex" class="search-option-btn" title="Use Regular Expression (Alt+R)" aria-label="Use Regular Expression">
              <span>.*</span>
            </button>
          </div>
          <button type="button" id="sidebar-toggle-all" class="sidebar-toggle-all-btn" title="Collapse all sections">
            <svg class="sidebar-toggle-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <polyline points="4 14 12 6 20 14" />
            </svg>
            <span class="sidebar-toggle-text">Collapse all</span>
          </button>
        </div>
        <div class="sidebar-filter-pills" id="sidebar-filter-pills">
          <button class="sidebar-pill active" data-type="all">All</button>
          <button class="sidebar-pill" data-type="class">Classes</button>
          <button class="sidebar-pill" data-type="function">Functions</button>
          <button class="sidebar-pill" data-type="task">Tasks</button>
          <button class="sidebar-pill" data-type="macro">Macros</button>
        </div>
      </div>

      <div class="sidebar-content" id="sidebar-content">
        <!-- Rendered by js/app.js -->
      </div>
    </aside>

    <!-- Main Viewport Panes -->
    <main class="app-viewport" id="app-viewport">
      <!-- Documentation Pane -->
      <section class="pane" id="doc-pane">
        <div class="pane-header">
          <div class="pane-header-title">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            <span id="doc-pane-title">Reference Documentation</span>
          </div>
          <div>
            <button class="icon-btn" id="open-full-doc" title="Expand documentation full width">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9" />
                <polyline points="9 21 3 21 3 15" />
                <line x1="21" y1="3" x2="14" y2="10" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            </button>
          </div>
        </div>
        <iframe id="doc-frame" class="pane-frame" src="docs_view/overviews/intro-txt.html"
          title="UVM Reference Documentation"></iframe>
      </section>

      <!-- Draggable Split Divider -->
      <div class="split-divider" id="split-divider" title="Drag to resize panes"></div>

      <!-- Source Code Pane -->
      <section class="pane" id="src-pane">
        <div class="pane-header">
          <div class="pane-header-title">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span id="src-pane-title">SystemVerilog Source</span>
          </div>
          <div>
            <button class="icon-btn" id="open-full-src" title="Expand source code full width">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9" />
                <polyline points="9 21 3 21 3 15" />
                <line x1="21" y1="3" x2="14" y2="10" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            </button>
          </div>
        </div>
        <iframe id="src-frame" class="pane-frame" src="src_view/comps/uvm_driver.svh.html#L44"
          title="SystemVerilog Source Code"></iframe>
      </section>
    </main>
  </div>

  <!-- Instant Search Modal -->
  <div class="search-modal-backdrop" id="search-modal">
    <div class="search-modal-card">
      <div class="modal-search-header">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" stroke-width="2" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" />
        </svg>
        <input type="text" id="modal-search-input" class="modal-search-input"
          placeholder="Search classes, functions, tasks, macros, files..." autocomplete="off">
        <button type="button" id="modal-search-clear" class="search-clear-btn" title="Clear search (Esc)" aria-label="Clear search" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <button type="button" id="modal-search-case" class="search-option-btn" title="Match Case (Alt+C)" aria-label="Match Case">
          <span>Aa</span>
        </button>
        <button type="button" id="modal-search-regex" class="search-option-btn" title="Use Regular Expression (Alt+R)" aria-label="Use Regular Expression">
          <span>.*</span>
        </button>
        <kbd class="search-kbd">ESC</kbd>
      </div>

      <div class="modal-search-filters">
        <button class="filter-pill active" data-type="all">All</button>
        <button class="filter-pill" data-type="class">Classes</button>
        <button class="filter-pill" data-type="function">Functions</button>
        <button class="filter-pill" data-type="task">Tasks</button>
        <button class="filter-pill" data-type="macro">Macros</button>
        <button class="filter-pill" data-type="file">Source Files</button>
      </div>

      <ul class="modal-search-results" id="modal-search-results">
        <!-- Injected dynamically by js/app.js -->
      </ul>

      <div class="modal-search-footer">
        <span><kbd class="search-kbd">↑</kbd> <kbd class="search-kbd">↓</kbd> to navigate</span>
        <span><kbd class="search-kbd">↵</kbd> to select</span>
        <span><kbd class="search-kbd">ESC</kbd> to close</span>
      </div>
    </div>
  </div>

  <!-- Search & App Scripts -->
  <script src="js/search_data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
