<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Fond clair légèrement bleuté avec bordure subtile -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBF3FF" />
    </linearGradient>

    <!-- Bleu nuit vers bleu roi intense -->
    <linearGradient id="leftStemDark" x1="0%" y1="15%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#052359" />
      <stop offset="60%" stop-color="#0A45A6" />
      <stop offset="100%" stop-color="#04183D" />
    </linearGradient>

    <!-- Cyan vif vers bleu azur -->
    <linearGradient id="rightStemVibrant" x1="65%" y1="15%" x2="25%" y2="95%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0051D5" />
    </linearGradient>

    <linearGradient id="innerBevelVibrant" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#5CE1FF" />
      <stop offset="100%" stop-color="#0073E6" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bgGradLight)" stroke="#D0E2FF" stroke-width="16" />

  <g transform="translate(512, 512) scale(1.28) translate(-512, -525)">
    <path d="M 288 338 A 67 67 0 0 1 422 338 L 422 570 C 422 652 500 665 560 610 C 590 582 602 520 602 470 L 650 580 C 630 695 570 770 492 770 C 365 770 288 680 288 555 Z" fill="url(#leftStemDark)" />
    <path d="M 492 770 C 572 770 602 658 602 555 L 602 315 C 602 385 685 422 736 392 L 736 555 C 736 685 628 770 492 770 Z" fill="url(#rightStemVibrant)" />
    <path d="M 492 770 C 572 770 602 658 602 555 L 602 315 C 602 356 632 386 668 397 L 668 555 C 668 655 605 748 492 770 Z" fill="url(#innerBevelVibrant)" />
    <path d="M 492 770 C 572 770 602 658 602 555 L 602 315" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Astérisque bleu foncé pour trancher sur le fond blanc -->
    <g transform="translate(698, 310)" fill="#052359">
      <rect x="-15" y="-62" width="30" height="124" rx="8" />
      <rect x="-15" y="-62" width="30" height="124" rx="8" transform="rotate(60)" />
      <rect x="-15" y="-62" width="30" height="124" rx="8" transform="rotate(120)" />
    </g>
  </g>
</svg>