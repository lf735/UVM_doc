<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Dégradé du fond bleu nuit -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#072863" />
      <stop offset="100%" stop-color="#051c47" />
    </linearGradient>

    <!-- Dégradé de la branche gauche du U (bleu vif vers bleu foncé) -->
    <linearGradient id="leftStemGrad" x1="0%" y1="15%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#1982fa" />
      <stop offset="55%" stop-color="#0d65d9" />
      <stop offset="85%" stop-color="#0b46a0" />
      <stop offset="100%" stop-color="#082e70" />
    </linearGradient>

    <!-- Dégradé de la branche droite du U (blanc/bleu très clair vers bleu azur) -->
    <linearGradient id="rightStemGrad" x1="65%" y1="15%" x2="25%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d5e9ff" />
      <stop offset="75%" stop-color="#6eb2ff" />
      <stop offset="100%" stop-color="#1f7bf2" />
    </linearGradient>

    <!-- Dégradé du biseau intérieur sur la branche droite -->
    <linearGradient id="innerBevelGrad" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#b8d9ff" />
      <stop offset="55%" stop-color="#8ec2ff" />
      <stop offset="100%" stop-color="#4193ff" />
    </linearGradient>

    <!-- Dégradé du reflet lumineux sur le pli -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Fond plein sans marges (identique à favicon_light.svg) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bgGrad)" />

  <!-- Ensemble du U avec le même zoom 1.28x et centrage que favicon_light.svg -->
  <g transform="translate(512, 512) scale(1.28) translate(-512, -525)">
    <!-- Partie gauche et courbe basse du "U" -->
    <path d="M 288 338
             A 67 67 0 0 1 422 338
             L 422 570
             C 422 652 500 665 560 610
             C 590 582 602 520 602 470
             L 650 580
             C 630 695 570 770 492 770
             C 365 770 288 680 288 555
             Z" fill="url(#leftStemGrad)" />

    <!-- Partie droite du "U" (ruban clair qui s'enroule) -->
    <path d="M 492 770
             C 572 770 602 658 602 555
             L 602 315
             C 602 385 685 422 736 392
             L 736 555
             C 736 685 628 770 492 770
             Z" fill="url(#rightStemGrad)" />

    <!-- Facette / biseau interne sur la branche droite pour l'effet de relief -->
    <path d="M 492 770
             C 572 770 602 658 602 555
             L 602 315
             C 602 356 632 386 668 397
             L 668 555
             C 668 655 605 748 492 770
             Z" fill="url(#innerBevelGrad)" />

    <!-- Ligne de pli lumineuse entre les deux sections -->
    <path d="M 492 770
             C 572 770 602 658 602 555
             L 602 315" fill="none" stroke="url(#edgeHighlight)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Astérisque à 6 branches en haut à droite -->
    <g transform="translate(698, 314)" fill="#ffffff">
      <rect x="-12" y="-56" width="24" height="112" rx="5" />
      <rect x="-12" y="-56" width="24" height="112" rx="5" transform="rotate(60)" />
      <rect x="-12" y="-56" width="24" height="112" rx="5" transform="rotate(120)" />
    </g>
  </g>
</svg>
