    <path d="M 288 338 A 67 67 0 0 1 422 338 L 422 570 C 422 652 500 665 560 610 C 590 582 602 520 602 470 L 650 580 C 630 695 570 770 492 770 C 365 770 288 680 288 555 Z" fill="url(#leftStemCyan)" />
